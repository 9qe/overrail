<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="Consolas, 'Cascadia Mono', monospace">
  <rect width="880" height="480" rx="8" fill="#0d1117"/>
  <rect width="880" height="34" rx="8" fill="#161b22"/>
  <circle cx="20" cy="17" r="5" fill="#f85149"/>
  <circle cx="38" cy="17" r="5" fill="#d29922"/>
  <circle cx="56" cy="17" r="5" fill="#3fb950"/>
  <text x="440" y="22" fill="#8b949e" font-size="13" text-anchor="middle">PowerShell — overrail chaos demo</text>
  <g font-size="15">
    <text x="24" y="62" fill="#3fb950">$ <tspan fill="#c9d1d9">node examples/chaos-demo.js</tspan></text>
    <text x="24" y="92" fill="#8b949e">overrail chaos demo — mock upstreams on localhost, no API keys</text>
    <text x="24" y="122" fill="#c9d1d9">client &lt;- "The"</text>
    <text x="24" y="146" fill="#c9d1d9">client &lt;- " quick"</text>
    <text x="24" y="170" fill="#c9d1d9">client &lt;- " brown"</text>
    <text x="330" y="170" fill="#f85149">← primary's socket dies mid-sentence</text>
    <text x="24" y="200" fill="#79c0ff">client &lt;- " fox"</text>
    <text x="330" y="200" fill="#79c0ff">← backup provider, same stream</text>
    <text x="24" y="224" fill="#79c0ff">client &lt;- " jumps"</text>
    <text x="24" y="248" fill="#79c0ff">client &lt;- " over the lazy dog."</text>
    <text x="24" y="278" fill="#8b949e">client &lt;- finish_reason=stop, merged usage: {"prompt_tokens":12,"completion_tokens":6}</text>
    <text x="24" y="302" fill="#8b949e">client &lt;- [DONE] (exactly one, after the full stitched reply)</text>
    <text x="24" y="336" fill="#c9d1d9">overrail sent the next provider:</text>
    <text x="40" y="360" fill="#d29922">{"role":"assistant","content":"The quick brown"}</text>
    <text x="24" y="394" fill="#3fb950">final stitched reply: "The quick brown fox jumps over the lazy dog."</text>
    <text x="24" y="418" fill="#3fb950">one continuous stream. no retry, no error, no lost tokens.</text>
    <text x="24" y="456" fill="#3fb950">$ </text>
  </g>
</svg>
