<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" xml:space="preserve" role="img" aria-labelledby="t1">
  <title id="t1">agentrouter terminal demo: init, list, chains, serve, and /v1/models output</title>
  <!-- card -->
  <rect x="0.5" y="0.5" width="879" height="469" rx="12" fill="#0d1117" stroke="#30363d"/>
  <!-- title bar -->
  <rect x="0.5" y="0.5" width="879" height="36" rx="12" fill="#161b22"/>
  <rect x="0.5" y="18" width="879" height="18" fill="#161b22"/>
  <line x1="0.5" y1="36.5" x2="879.5" y2="36.5" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="6" fill="#6e7681"/>
  <circle cx="42" cy="18.5" r="6" fill="#6e7681"/>
  <circle cx="62" cy="18.5" r="6" fill="#6e7681"/>
  <!-- transcript -->
  <g font-family="'Cascadia Code', Consolas, monospace" font-size="13">
    <text x="24" y="67"><tspan fill="#3fb950">PS C:\dev&gt;</tspan><tspan fill="#e6edf3"> agentrouter init</tspan></text>
    <text x="24" y="87" fill="#8b949e">Active: deepseek</text>
    <text x="24" y="107"><tspan fill="#3fb950">PS C:\dev&gt;</tspan><tspan fill="#e6edf3"> agentrouter list</tspan></text>
    <text x="24" y="127" fill="#8b949e">*deepseek    DeepSeek                        Get a key at platform.deepseek.com</text>
    <text x="24" y="147" fill="#8b949e"> kimi        Kimi / Moonshot                 Get a key at platform.moonshot.ai</text>
    <text x="24" y="167" fill="#8b949e"> openrouter  OpenRouter                      Hundreds of models behind one key</text>
    <text x="24" y="187" fill="#8b949e"> ollama      Ollama (local, no key)          Fully local. Pull models with: ollama pull qwen3:8b</text>
    <text x="24" y="207"><tspan fill="#3fb950">PS C:\dev&gt;</tspan><tspan fill="#e6edf3"> agentrouter chains</tspan></text>
    <text x="24" y="227" fill="#8b949e">default: deepseek -&gt; kimi -&gt; openrouter -&gt; ollama</text>
    <text x="24" y="247" fill="#8b949e">local:   ollama</text>
    <text x="24" y="267"><tspan fill="#3fb950">PS C:\dev&gt;</tspan><tspan fill="#e6edf3"> agentrouter serve</tspan></text>
    <text x="24" y="287"><tspan fill="#8b949e">agentrouter gateway listening on </tspan><tspan fill="#79c0ff">http://127.0.0.1:8787</tspan></text>
    <text x="24" y="307" fill="#8b949e">Point any OpenAI-compatible client at it. Model field: '&lt;profile&gt;' or '&lt;profile&gt;/&lt;model&gt;'.</text>
    <text x="24" y="327" fill="#79c0ff">Failover chain (default): deepseek -&gt; kimi -&gt; openrouter -&gt; ollama</text>
    <text x="24" y="347"><tspan fill="#3fb950">PS C:\dev&gt;</tspan><tspan fill="#e6edf3"> curl http://127.0.0.1:8787/v1/models</tspan></text>
    <text x="24" y="367" fill="#8b949e">{"object":"list","data":[{"id":"deepseek","object":"model","created":1793499949,"owned_by":"DeepSeek"},</text>
    <text x="24" y="387" fill="#8b949e">{"id":"kimi","object":"model","created":1793499949,"owned_by":"Kimi / Moonshot"},</text>
    <text x="24" y="407" fill="#8b949e">{"id":"openrouter","object":"model","created":1793499949,"owned_by":"OpenRouter"},</text>
    <text x="24" y="427" fill="#8b949e">{"id":"ollama","object":"model","created":1793499949,"owned_by":"Ollama (local, no key)"}]}</text>
    <text x="24" y="447"><tspan fill="#3fb950">PS C:\dev&gt;</tspan></text>
    <rect x="110" y="437" width="7" height="13" fill="#e6edf3"/>
  </g>
</svg>
